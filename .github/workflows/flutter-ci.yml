
      - name: Build Android debug APK
        shell: bash
        run: |
          if flutter build apk --debug --no-pub; then
            echo "APK build successful"
          else
            echo "First build failed"
            echo "Retrying after sequential Kotlin compilation"

            if [ ! -f android/gradlew ]; then
              echo "Gradle wrapper not found"
              exit 1
            fi

            (
              cd android
              bash ./gradlew \
                :firebase_auth:compileDebugKotlin \
                :firebase_storage:compileDebugKotlin \
                --no-parallel \
                --max-workers=1 \
                --no-daemon \
                --stacktrace
            )

            flutter build apk --debug --no-pub
          fi
